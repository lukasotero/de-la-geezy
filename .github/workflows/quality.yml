name: Calidad

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install chromium webkit

      - name: Validar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Compilar producción
        run: npm run build

      - name: Ejecutar matriz responsive y visual
        run: npm run test:e2e

      - name: Publicar diagnóstico de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
